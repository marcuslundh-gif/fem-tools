[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "femtools"
version = "1.6.0"
description = "Verifierade FEM-mallar: gmsh-meshning + scikit-fem (P2) statik/modal, mm-N-MPa"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem>=10", "gmsh", "meshio", "matplotlib", "threadpoolctl", "pypardiso; platform_machine=='x86_64' or platform_machine=='AMD64'"]

[tool.setuptools]
packages = ["femtools"]

[tool.setuptools.package-data]
femtools = ["materials.json"]
